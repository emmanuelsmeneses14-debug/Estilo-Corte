<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Estilo & Corte</title>
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="barber-stripe"></div>
     <header>
    <div class="header-container">
        <div class="logo-area">
            <img src="img/logo.png" alt="Logo Estilo & Corte" class="logo-img" style="height: 50px; width: auto; object-fit: contain;">
            <h2>ESTILO & CORTE</h2>
        </div>
        <input type="checkbox" id="menu-bar" class="menu-bar">
        <label for="menu-bar" class="menu-button" aria-label="Abrir menú">
            <i class="fa-solid fa-bars"></i>
        </label>
        <nav class="main-nav">
            <ul>
                <li><a href="index.html">INICIO</a></li>
                <li><a href="login.html">LOGIN</a></li>
                <li><a href="Home.html">HOME</a></li>
                <li><a href="productos.html" class="active">PRODUCTOS</a></li>
                <li><a href="encuentranos.html">UBICACIÓN</a></li>
                <li><a href="reservas.html">CITAS</a></li>
            </ul>
        </nav>
    </div>
</header>

    <main style="display: flex; justify-content: center; align-items: center; padding: 50px 20px; min-height: 520px;">
       
        <div style="background-color: var(--navy-header); padding: 35px; border-radius: 8px; width: 100%; max-width: 420px; text-align: center; color: white; border: 2px solid var(--gold-accent); box-shadow: 0 10px 25px rgba(0,0,0,0.3);">
            
            <div class="logo-badge" style="display: inline-block; margin-bottom: 15px; font-size: 1.2rem;">E & C</div>
            <h3 style="color: var(--gold-accent); margin-bottom: 20px;">ACCESO AL SISTEMA</h3>

           
            <form action="Home.html">
                <div style="margin-bottom: 15px; text-align: left;">
                    <label style="font-size: 0.8rem; text-transform: uppercase;">Correo Electrónico</label>
                    <div style="position: relative; display: flex; align-items: center; margin-top: 5px;">
                        <i class="fa-solid fa-envelope" style="position: absolute; left: 12px; color: var(--navy-header);"></i>
                        <input type="email" required placeholder="tu@correo.com" style="width: 100%; padding: 10px 10px 10px 38px; border-radius: 4px; border: none; outline: none;">
                    </div>
                </div>

                <div style="margin-bottom: 20px; text-align: left;">
                    <label style="font-size: 0.8rem; text-transform: uppercase;">Contraseña</label>
                    <div style="position: relative; display: flex; align-items: center; margin-top: 5px;">
                        <i class="fa-solid fa-lock" style="position: absolute; left: 12px; color: var(--navy-header);"></i>
                        <input type="password" required placeholder="" style="width: 100%; padding: 10px 10px 10px 38px; border-radius: 4px; border: none; outline: none;">
                    </div>
                </div>

                <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                    <button type="submit" class="btn-gold" style="flex: 1;">INGRESAR</button>
                </div>
            </form>

          
            <details style="border-top: 1px solid rgba(255,255,255,0.2); padding-top: 15px; margin-top: 15px;">
                <summary style="cursor: pointer; color: var(--gold-accent); font-size: 0.9rem; font-weight: bold; list-style: none;">
                    <i class="fa-solid fa-user-plus"></i> ¿No tienes cuenta? Registrate aquí
                </summary>

                <form action="Home.html" style="margin-top: 20px;">
                    <div style="margin-bottom: 15px; text-align: left;">
                        <label style="font-size: 0.8rem; text-transform: uppercase;">Nombre Completo</label>
                        <div style="position: relative; display: flex; align-items: center; margin-top: 5px;">
                            <i class="fa-solid fa-user" style="position: absolute; left: 12px; color: var(--navy-header);"></i>
                            <input type="text" required placeholder="Juan Pérez" style="width: 100%; padding: 10px 10px 10px 38px; border-radius: 4px; border: none; outline: none;">
                        </div>
                    </div>

                    <div style="margin-bottom: 15px; text-align: left;">
                        <label style="font-size: 0.8rem; text-transform: uppercase;">Correo Electrónico</label>
                        <div style="position: relative; display: flex; align-items: center; margin-top: 5px;">
                            <i class="fa-solid fa-envelope" style="position: absolute; left: 12px; color: var(--navy-header);"></i>
                            <input type="email" required placeholder="tu@correo.com" style="width: 100%; padding: 10px 10px 10px 38px; border-radius: 4px; border: none; outline: none;">
                        </div>
                    </div>

                    <div style="margin-bottom: 20px; text-align: left;">
                        <label style="font-size: 0.8rem; text-transform: uppercase;">Contraseña</label>
                        <div style="position: relative; display: flex; align-items: center; margin-top: 5px;">
                            <i class="fa-solid fa-lock" style="position: absolute; left: 12px; color: var(--navy-header);"></i>
                            <input type="password" required placeholder="" style="width: 100%; padding: 10px 10px 10px 38px; border-radius: 4px; border: none; outline: none;">
                        </div>
                    </div>

                    <button type="submit" class="btn-gold" style="width: 100%;">CREAR CUENTA</button>
                </form>
            </details>

        </div>
    </main>

    <footer>
        <p>&copy; 2026 Estilo & Corte - Barbería Colombia.</p>
    </footer>
    <div class="barber-stripe"></div>

</body>
</html>
